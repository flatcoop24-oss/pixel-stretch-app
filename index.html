<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pixel Stretch"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><title>Pixel Stretch</title></head><body><main class="app"><header class="editor-top"><button id="resetBtn" class="icon-btn">×</button><div class="history"><button id="undoBtn" class="icon-btn" disabled>↶</button><button id="redoBtn" class="icon-btn" disabled>↷</button></div><div class="top-right"><label class="icon-btn">＋<input id="fileInput" type="file" accept="image/*" hidden></label><button id="saveBtn" class="done-btn">저장</button></div></header><section class="workspace"><div id="emptyState" class="empty"><div class="empty-icon">✦</div><h1>Pixel Stretch</h1><p>사진의 픽셀을 고르고 바깥으로 쓸어<br>이미지 뒤에 질감처럼 뿌려보세요.</p><label class="load-btn">사진 선택<input id="firstInput" type="file" accept="image/*" hidden></label></div><div id="viewport" class="viewport hidden"><div id="stage" class="stage"><canvas id="effectCanvas"></canvas><canvas id="imageCanvas"></canvas><canvas id="overlay"></canvas></div><div id="hint" class="hint">사진 위를 짧게 그어 픽셀을 선택하세요</div><button id="fitBtn" class="fit-btn">맞춤</button></div></section><section id="controls" class="controls hidden"><div class="tool-row"><button class="tool active" data-tool="pick"><span>╱</span><small>선택</small></button><button class="tool" data-tool="spray"><span>⌁</span><small>스프레이</small></button><button class="tool" data-tool="stretch"><span>↗</span><small>스트레치</small></button><button class="tool" data-tool="hand"><span>✋</span><small>이동</small></button></div><div class="mode-row"><button class="mode active" data-mode="soft">소프트</button><button class="mode" data-mode="solid">솔리드</button><button class="mode" data-mode="fan">확장</button><button class="mode" data-mode="curve">휘기</button></div><div class="sliders"><label><span>크기 <output id="sizeOut">24</output></span><input id="size" type="range" min="2" max="120" value="24"></label><label><span>밀도 <output id="densityOut">65</output></span><input id="density" type="range" min="10" max="100" value="65"></label><label><span>흐림 <output id="softnessOut">35</output></span><input id="softness" type="range" min="0" max="80" value="35"></label><label><span>불투명도 <output id="opacityOut">90</output></span><input id="opacity" type="range" min="10" max="100" value="90"></label></div><div class="selection-actions"><button id="reselectBtn">픽셀 다시 선택</button><button id="clearEffectBtn">효과 지우기</button></div></section></main><div id="toast" class="toast"></div><script src="./app.js"></script></body></html>
